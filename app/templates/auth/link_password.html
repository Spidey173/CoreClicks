<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Required — CoreClicks Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3 position-relative" style="background: radial-gradient(circle at 50% 20%, rgba(228, 87, 46, 0.1) 0%, var(--bg-body) 80%);">

<div class="ambient-glow-magma" style="top: -150px; left: -100px;"></div>
<div class="ambient-glow-amber" style="bottom: -150px; right: -100px;"></div>

<div class="magma-card-elevated p-4 p-md-5 text-center position-relative z-1" style="max-width: 440px; width: 100%;">
    <div class="d-inline-flex p-3 rounded-circle text-white mb-3 shadow" style="background: var(--gradient-sunset);">
        <i class="fas fa-lock fs-2"></i>
    </div>
    <h3 class="fw-bold mb-1">Protected Smart Link</h3>
    <p class="text-muted small mb-4">Enter the access password to verify cryptographic authorization and redirect.</p>

    {% if error %}
    <div class="alert alert-danger small py-2 border-0 mb-3">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <input type="password" name="password" class="form-control form-control-saas text-center font-mono fs-5" placeholder="••••••••" required autofocus>
        </div>
        <button type="submit" class="btn-magma-primary w-100 py-2 fw-semibold">
            <i class="fas fa-unlock me-1"></i> Unlock & Continue
        </button>
    </form>
</div>

</body>
</html>

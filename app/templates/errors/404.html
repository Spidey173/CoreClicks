{% extends "base.html" %}

{% block title %}404 — Page Not Found — CoreClicks 2.0{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="magma-card p-5 max-w-600 mx-auto position-relative overflow-hidden">
        <div class="display-1 fw-bold text-magma mb-3 font-heading">404</div>
        <h2 class="fw-bold mb-2">Instrument Not Located</h2>
        <p class="text-muted mb-4">The route, resource, or utility dataset you requested does not exist or has been relocated.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.dashboard') }}" class="btn-magma-primary px-4">
                <i class="fas fa-gauge me-1"></i> Workspace
            </a>
            <a href="/" class="btn-magma-outline px-4">
                <i class="fas fa-compass me-1"></i> Public Showcase
            </a>
        </div>
    </div>
</div>
{% endblock %}
